<!DOCTYPE html>
<html lang="ko">

    <title>원가구렌탈 - 상업용·사무용 가구 맞춤 렌탈</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #d69e2e;
            --bg-light: #f7fafc;
            --text-color: #2d3748;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        body { color: var(--text-color); line-height: 1.6; background-color: #fff; }
        
        /* 헤더 */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; background: white; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary-color); text-decoration: none; }
        nav a { margin-left: 20px; text-decoration: none; color: var(--text-color); font-weight: 550; }
        nav a:hover { color: var(--accent-color); }

        /* 상단 배너 */
        .hero { position: relative; height: 420px; background: linear-gradient(rgba(26, 54, 93, 0.8), rgba(26, 54, 93, 0.8)), url('https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=1600&q=80') center/cover; color: white; text-align: center; display: flex; align-items: center; justify-content: center; }
        .hero-content { max-width: 800px; padding: 0 20px; z-index: 2; }
        .hero h1 { font-size: 36px; margin-bottom: 15px; }
        .hero p { font-size: 18px; margin-bottom: 25px; opacity: 0.9; }
        
        .btn { display: inline-block; background-color: var(--accent-color); color: white; padding: 12px 30px; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; }
        .btn:hover { background-color: #b7791f; }

        /* 섹션 공통 */
        section { padding: 60px 8%; border-bottom: 1px solid #edf2f7; }
        .section-title { font-size: 26px; margin-bottom: 30px; color: var(--primary-color); border-left: 5px solid var(--accent-color); padding-left: 15px; }

        /* 4대 메인 카테고리 요약 칸 */
        .categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .cat-card { background: var(--bg-light); padding: 25px; text-align: center; border-radius: 8px; border: 1px solid #e2e8f0; transition: 0.3s; }
        .cat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
        .cat-card h3 { margin-bottom: 8px; color: var(--primary-color); font-size: 18px; }
        .cat-card p { font-size: 13px; color: #718096; margin-bottom: 15px; }

        /* 상품 카드 그리드 */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .product-card { background: white; border-radius: 6px; border: 1px solid #e2e8f0; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        .product-img { width: 100%; height: 140px; object-fit: cover; background-color: #e2e8f0; }
        .product-info { padding: 12px; }
        .product-info h4 { font-size: 15px; margin-bottom: 4px; color: var(--primary-color); }
        .product-info p { font-size: 12px; color: #718096; }
