<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원가구렌탈 - 상업용·사무용 가구 맞춤 렌탈</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #d69e2e;
            --bg-light: #f7fafc;
            --text-color: #2d3748;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        body { color: var(--text-color); line-height: 1.6; background-color: #fff; }
        
        /* 헤더 */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; background: white; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary-color); text-decoration: none; }
        nav a { margin-left: 20px; text-decoration: none; color: var(--text-color); font-weight: 550; }
        nav a:hover { color: var(--accent-color); }

        /* 상단 배너 */
        .hero { background: linear-gradient(rgba(26, 54, 93, 0.8), rgba(26, 54, 93, 0.8)), url('https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=1600&q=80') center/cover; color: white; text-align: center; padding: 100px 20px; }
        .hero h1 { font-size: 38px; margin-bottom: 20px; }
        .hero p { font-size: 18px; margin-bottom: 30px; opacity: 0.9; }
        .btn { display: inline-block; background-color: var(--accent-color); color: white; padding: 12px 30px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .btn:hover { background-color: #b7791f; }

        /* 섹션 공통 */
        section { padding: 80px 10%; border-bottom: 1px solid #edf2f7; }
        .section-title { text-align: center; font-size: 28px; margin-bottom: 50px; color: var(--primary-color); }

        /* 4대 카테고리 그리드 */
        .categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .cat-card { background: var(--bg-light); padding: 30px; text-align: center; border-radius: 8px; border: 1px solid #e2e8f0; transition: 0.3s; }
        .cat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
        .cat-card h3 { margin-bottom: 10px; color: var(--primary-color); }

        /* 견적 폼 */
        .quote-section { background-color: var(--bg-light); }
        form { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 4px; }
        .form-group textarea { height: 120px; }

        /* 푸터 */
        footer { background: var(--primary-color); color: white; text-align: center; padding: 40px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header>
        <a href="#" class="logo">원가구렌탈</a>
        <nav>
            <a href="#categories">렌탈 카테고리</a>
            <a href="#quote" style="color: var(--accent-color);">견적 문의</a>
        </nav>
    </header>

    <!-- 히어로 배너 -->
    <div class="hero">
        <h1>공간의 가치를 높이는 맞춤 가구 렌탈</h1>
        <p>사무실부터 대형 행사까지, 가장 합리적인 조건으로 프리미엄 가구를 제안합니다.</p>
        <a href="#quote" class="btn">빠른 견적 신청하기</a>
    </div>

    <!-- 카테고리 4분할 -->
    <section id="categories">
        <h2 class="section-title">주요 렌탈 카테고리</h2>
        <div class="categories">
            <div class="cat-card">
                <h3>사무용
